name: OgeNotes CI

on:
  pull_request:
  push:
    branches: [main, 'implementation/**']

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for private keys and common credential formats
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}' -- ':!package-lock.json'; then
            echo 'Potential secret found in tracked files' >&2
            exit 1
          fi
      - name: Run baseline tests
        run: npm test
      - name: Build application
        run: npm run build
        env:
          # The current dashboard shell does not connect to production services at build time.
          NEXT_TELEMETRY_DISABLED: 1
          AUTH_SECRET: ci-only-placeholder-secret-32-characters-minimum
          AUTH_GOOGLE_ID: ci-placeholder.apps.googleusercontent.com
          AUTH_GOOGLE_SECRET: ci-only-placeholder-secret
